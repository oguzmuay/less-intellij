name: Release

# Runs only when a tag like release-0.2.1 is pushed (no runs on branch pushes or other tags).
# The version after "release-" must match the VERSION file; all plugins are built and released with it.
on:
  push:
    tags: ["release-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#release-}"
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($FILE_VERSION)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugins and updatePlugins.xml
        env:
          GITHUB_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#release-}" scripts/release.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            less-*-plugin/build/distributions/*.zip updatePlugins.xml \
            --title "${{ github.ref_name }}" --generate-notes
